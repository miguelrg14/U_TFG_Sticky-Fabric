name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests and simulation (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and run the solver tests
        run: >
          dotnet test tests/StickyFabric.Core.Tests
          --configuration Release
          --logger "trx;LogFileName=core-tests.trx"
          --logger "console;verbosity=normal"
          --results-directory build/test-results

      - name: Run the headless simulation (smoke test)
        run: dotnet run --project tools/StickyFabric.Simulation --configuration Release -- --csv build/simulation

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-results
          path: build/

  unity-license:
    name: Check Unity license
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unity jobs skipped::Add the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD secrets to run the Unity tests and builds (see README)."
          fi

  unity-tests:
    name: Unity EditMode and PlayMode tests
    needs: [core, unity-license]
    if: needs.unity-license.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Sticky-Fabric/Library
          key: Library-${{ hashFiles('Sticky-Fabric/Packages/packages-lock.json', 'Sticky-Fabric/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Sticky-Fabric
          testMode: all
          artifactsPath: build/unity-test-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  webgl:
    name: WebGL build
    needs: [unity-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Sticky-Fabric/Library
          key: Library-WebGL-${{ hashFiles('Sticky-Fabric/Packages/packages-lock.json', 'Sticky-Fabric/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Sticky-Fabric
          targetPlatform: WebGL
          buildName: StickyFabric

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/StickyFabric

  deploy-pages:
    name: Deploy demo to GitHub Pages
    needs: [webgl]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
