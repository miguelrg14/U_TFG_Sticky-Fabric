name: CI

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancelling a running Unity build sends SIGKILL to the container -> exit code 137.
  # Keep cancellation for branches/PRs, but never for a release tag.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  core:
    name: Core tests and simulation (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and run the solver tests
        run: >
          dotnet test tests/StickyFabric.Core.Tests
          --configuration Release
          --logger "trx;LogFileName=core-tests.trx"
          --logger "console;verbosity=normal"
          --results-directory build/test-results

      - name: Run the headless simulation (smoke test)
        run: dotnet run --project tools/StickyFabric.Simulation --configuration Release -- --csv build/simulation

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-results
          path: build/

  unity-license:
    name: Check Unity license
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unity jobs skipped::Add the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD secrets to run the Unity tests and builds (see README)."
          fi

  unity-tests:
    name: Unity EditMode and PlayMode tests
    needs: [core, unity-license]
    if: needs.unity-license.outputs.available == 'true'
    runs-on: ubuntu-latest
    # The GameCI test runner publishes a "Test Results" check run, which needs checks: write.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Add swap space (avoids OOM kills / exit code 137)
        run: |
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
          fi
          sudo swapon /swapfile || true
          free -h

      - uses: actions/cache@v4
        with:
          # Keep test imports separate from player builds (different build targets).
          path: Sticky-Fabric/Library
          key: Library-Tests-${{ hashFiles('Sticky-Fabric/Packages/packages-lock.json', 'Sticky-Fabric/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Tests-

      # Unity 6.6+ needs >= 4.3.2: older versions fail with the Docker /dev/shm default of 64 MB.
      - uses: game-ci/unity-test-runner@v4.3.2
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Sticky-Fabric
          testMode: all
          artifactsPath: build/unity-test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  webgl:
    name: WebGL build
    needs: [unity-tests]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # The Unity Docker image plus a player build need more disk than the runner has free.
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - name: Add swap space (avoids OOM kills / exit code 137)
        run: |
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
          fi
          sudo swapon /swapfile || true
          free -h

      - uses: actions/checkout@v4

      - name: Monitor RAM during the build
        run: (while true; do date; free -h; sleep 10; done) > "$RUNNER_TEMP/memory.log" 2>&1 &

      - uses: actions/cache@v4
        with:
          path: Sticky-Fabric/Library
          key: Library-WebGL-${{ hashFiles('Sticky-Fabric/Packages/packages-lock.json', 'Sticky-Fabric/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-WebGL-

      # v6 is a drop-in upgrade from v4/v5 and fixes Unity 6.6+ shared memory.
      - uses: game-ci/unity-builder@v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # v6 has no dockerShmSize input; the CLI reads this env var (default 1025m).
          GAME_CI_DOCKER_SHM_SIZE: 2g
        with:
          projectPath: Sticky-Fabric
          targetPlatform: WebGL
          buildName: StickyFabric
          cliVersion: v0.1.77
          customParameters: -job-worker-count 2
          allowDirtyBuild: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/StickyFabric

      - uses: actions/upload-artifact@v4
        with:
          name: build-webgl
          path: build/WebGL/StickyFabric

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-webgl
          path: ${{ runner.temp }}/memory.log

  standalone:
    name: Build ${{ matrix.target }}
    needs: [unity-tests]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: StandaloneWindows64
            artifact: windows
          - target: StandaloneLinux64
            artifact: linux
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - name: Add swap space (avoids OOM kills / exit code 137)
        run: |
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
          fi
          sudo swapon /swapfile || true
          free -h

      - uses: actions/checkout@v4

      - name: Monitor RAM during the build
        run: (while true; do date; free -h; sleep 10; done) > "$RUNNER_TEMP/memory.log" 2>&1 &

      - uses: actions/cache@v4
        with:
          path: Sticky-Fabric/Library
          key: Library-${{ matrix.target }}-${{ hashFiles('Sticky-Fabric/Packages/packages-lock.json', 'Sticky-Fabric/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ matrix.target }}-

      - uses: game-ci/unity-builder@v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # v6 has no dockerShmSize input; the CLI reads this env var (default 1025m).
          GAME_CI_DOCKER_SHM_SIZE: 2g
        with:
          projectPath: Sticky-Fabric
          targetPlatform: ${{ matrix.target }}
          buildName: StickyFabric
          cliVersion: v0.1.77
          customParameters: -job-worker-count 2
          allowDirtyBuild: true

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.artifact }}
          path: build/${{ matrix.target }}/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-${{ matrix.target }}
          path: ${{ runner.temp }}/memory.log

  deploy-pages:
    name: Deploy demo to GitHub Pages
    needs: [webgl]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish GitHub Release
    needs: [webgl, standalone]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist

      - name: Package builds
        run: |
          cd "$GITHUB_WORKSPACE/dist"
          (cd build-webgl   && zip -qr ../sticky-fabric-webgl.zip .)
          (cd build-windows && zip -qr ../sticky-fabric-windows.zip .)
          (cd build-linux   && tar -czf ../sticky-fabric-linux.tar.gz .)

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/sticky-fabric-webgl.zip
            dist/sticky-fabric-windows.zip
            dist/sticky-fabric-linux.tar.gz
