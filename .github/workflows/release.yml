name: Release

# Pushing a v* tag builds the Windows, Linux and WebGL players and publishes them in a GitHub release.
# Running it manually (Actions > Release > Run workflow) only builds them and keeps the zips as run artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            label: Windows
          - targetPlatform: StandaloneLinux64
            label: Linux
          - targetPlatform: WebGL
            label: WebGL
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.sha) }}
    steps:
      - name: Require a Unity license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error title=Missing secret::Releases need the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD secrets (see README)."
            exit 1
          fi

      # The Unity Docker image plus a player build need more disk than the runner has free.
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      # Full history so GameCI can read the version from the tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: Sticky-Fabric/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Sticky-Fabric/Packages/packages-lock.json', 'Sticky-Fabric/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Sticky-Fabric
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: StickyFabric
          versioning: ${{ startsWith(github.ref, 'refs/tags/') && 'Tag' || 'None' }}
          customParameters: -job-worker-count 2

      # Windows/Linux builds are loose files (StickyFabric.exe, StickyFabric_Data, ...) in build/<platform>/;
      # WebGL builds are a StickyFabric/ folder. Both end up in one folder inside the zip.
      - name: Package
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          src="build/${{ matrix.targetPlatform }}"
          [ -d "$src/StickyFabric" ] && src="$src/StickyFabric"
          rm -rf "$src"/*_DoNotShip "$src"/*_ButDontShipItWithYourGame

          name="StickyFabric-${VERSION}-${{ matrix.label }}"
          mkdir -p "dist/$name"
          cp -a "$src"/. "dist/$name/"
          (cd dist && zip -qr "$name.zip" "$name")

          ls -la "dist/$name"
          test -n "$(ls -A "dist/$name")"

      - uses: actions/upload-artifact@v4
        with:
          name: StickyFabric-${{ matrix.label }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
